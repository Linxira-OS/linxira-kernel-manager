[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linxira-kernel-manager"
version = "0.1.0"
description = "Read-only kernel, boot, and fixed-operation planning for Linxira OS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Linxira OS contributors"}]
dependencies = ["PySide6>=6.7"]

[project.urls]
Homepage = "https://linxira-os.github.io/"
Repository = "https://github.com/Linxira-OS/linxira-kernel-manager"
Issues = "https://github.com/Linxira-OS/linxira-kernel-manager/issues"
Documentation = "https://linxira-os.github.io/linxira-wiki/"

[project.scripts]
linxira-kernel-manager = "linxira_kernel_manager.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["data/org.linxira.KernelManager.desktop"]
"share/metainfo" = ["data/org.linxira.KernelManager.metainfo.xml"]
